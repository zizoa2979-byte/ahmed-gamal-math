<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ exam.title }} | {{ settings.platform_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body { background-color: #090f1d; color: #f8fafc; min-height: 100vh; }
    .card-box {
      background-color: #111b30;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
    }
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #090f1d;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
    }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-1">{{ exam.title }}</h4>
        <small class="text-secondary">{{ exam.grade }} • {{ exam.questions|length }} سؤال</small>
      </div>
      <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-light btn-sm rounded-3">العودة لحسابي</a>
    </div>

    {% if exam.questions %}
      <form method="POST" action="{{ url_for('take_exam', exam_id=exam.id) }}">
        {% for q in exam.questions %}
          <div class="card-box mb-3">
            <div class="fw-bold mb-3">{{ loop.index }}. {{ q.question_text }}</div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="A" id="q{{ q.id }}a" required />
              <label class="form-check-label" for="q{{ q.id }}a">{{ q.option_a }}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="B" id="q{{ q.id }}b" />
              <label class="form-check-label" for="q{{ q.id }}b">{{ q.option_b }}</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="C" id="q{{ q.id }}c" />
              <label class="form-check-label" for="q{{ q.id }}c">{{ q.option_c }}</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="q_{{ q.id }}" value="D" id="q{{ q.id }}d" />
              <label class="form-check-label" for="q{{ q.id }}d">{{ q.option_d }}</label>
            </div>
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-gold w-100">تسليم الامتحان وحساب الدرجة</button>
      </form>
    {% else %}
      <div class="card-box text-center py-5">
        <p class="text-secondary mb-0">لا توجد أسئلة مضافة لهذا الامتحان بعد.</p>
      </div>
    {% endif %}

    <footer class="text-center py-4 mt-4 text-warning fw-bold small">
      تطوير المهندس عبدالعزيز أمير
    </footer>
  </div>
</body>
</html>
