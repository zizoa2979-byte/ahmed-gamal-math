<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول / حساب جديد | {{ settings.platform_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Cairo', sans-serif; }
    body {
      background-color: #090f1d;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      background-color: #111b30;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 24px;
      padding: 32px;
      max-width: 560px;
      width: 100%;
      margin: auto;
    }
    .form-control, .form-select {
      background-color: #090f1d;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #090f1d;
      color: #fff;
      border-color: #f59e0b;
      box-shadow: none;
    }
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #090f1d;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 11px;
    }
    .btn-gold:hover { color: #090f1d; opacity: 0.92; }
  </style>
</head>
<body>

  <div class="container py-3">
    <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm rounded-3">← العودة للرئيسية</a>
  </div>

  <div class="container my-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mx-auto mb-3" style="max-width: 560px;">
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3" role="alert">
              {{ msg }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-card">
      <h4 class="fw-bold text-center mb-1">{{ settings.platform_name }}</h4>
      <p class="text-secondary text-center small mb-4">{{ settings.teacher_name }}</p>

      <ul class="nav nav-pills nav-fill mb-4 gap-2" id="authTabs">
        <li class="nav-item">
          <button class="nav-link {% if request.args.get('mode') != 'register' %}active bg-warning text-dark fw-bold{% else %}text-white{% endif %} rounded-3" type="button" onclick="showTab('login')">
            تسجيل الدخول
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link {% if request.args.get('mode') == 'register' %}active bg-warning text-dark fw-bold{% else %}text-white{% endif %} rounded-3" type="button" onclick="showTab('register')">
            إنشاء حساب طالب
          </button>
        </li>
      </ul>

      <form method="POST" action="{{ url_for('auth') }}" id="loginForm" class="{% if request.args.get('mode') == 'register' %}d-none{% endif %}">
        <input type="hidden" name="action" value="login" />
        <div class="mb-3">
          <label class="form-label small fw-bold">رقم الهاتف أو اسم المستخدم</label>
          <input type="text" name="login_id" class="form-control" placeholder="أدخل رقم الهاتف أو اسم المستخدم" required />
        </div>
        <div class="mb-4">
          <label class="form-label small fw-bold">كلمة المرور</label>
          <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required />
        </div>
        <button type="submit" class="btn btn-gold w-100">دخول</button>
      </form>

      <form method="POST" action="{{ url_for('auth') }}" id="registerForm" class="{% if request.args.get('mode') != 'register' %}d-none{% endif %}">
        <input type="hidden" name="action" value="register" />
        <div class="mb-3">
          <label class="form-label small fw-bold">الاسم الكامل للطالب</label>
          <input type="text" name="full_name" class="form-control" placeholder="اكتب اسمك الثلاثي أو الكامل" required />
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold">رقم هاتف الطالب</label>
            <input type="text" name="phone" class="form-control" placeholder="01xxxxxxxxx" required />
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">الصف الدراسي</label>
            <select name="grade" class="form-select" required>
              {% for g in grades %}
                <option value="{{ g }}">{{ g }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold">اسم ولي الأمر</label>
            <input type="text" name="parent_name" class="form-control" placeholder="اسم ولي الأمر" required />
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">رقم هاتف ولي الأمر</label>
            <input type="text" name="parent_phone" class="form-control" placeholder="01xxxxxxxxx" required />
          </div>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label small fw-bold">المحافظة</label>
            <input type="text" name="governorate" class="form-control" value="الدقهلية" required />
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">كلمة المرور</label>
            <input type="password" name="password" class="form-control" placeholder="اختر كلمة مرور" required />
          </div>
        </div>
        <button type="submit" class="btn btn-gold w-100">إنشاء الحساب</button>
      </form>
    </div>
  </div>

  <footer class="text-center py-3 text-warning fw-bold small">
    تطوير المهندس عبدالعزيز أمير
  </footer>

  <script>
    function showTab(tab) {
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const buttons = document.querySelectorAll("#authTabs .nav-link");
      if (tab === "login") {
        loginForm.classList.remove("d-none");
        registerForm.classList.add("d-none");
        buttons[0].classList.add("active", "bg-warning", "text-dark", "fw-bold");
        buttons[0].classList.remove("text-white");
        buttons[1].classList.remove("active", "bg-warning", "text-dark", "fw-bold");
        buttons[1].classList.add("text-white");
      } else {
        registerForm.classList.remove("d-none");
        loginForm.classList.add("d-none");
        buttons[1].classList.add("active", "bg-warning", "text-dark", "fw-bold");
        buttons[1].classList.remove("text-white");
        buttons[0].classList.remove("active", "bg-warning", "text-dark", "fw-bold");
        buttons[0].classList.add("text-white");
      }
    }
  </script>
</body>
</html>
